{% extends "base.html" %}
{% block title %}Autores · Admin{% endblock %}
{% block content %}
<h1>Autores</h1>
<nav class="admin-nav" aria-label="Secciones de administración">
  <a href="{{ url_for('admin.listar_libros') }}">Libros</a>
  <a href="{{ url_for('admin.crear_libro') }}">Nuevo libro</a>
  <a href="{{ url_for('admin.gestionar_autores') }}">Autores</a>
  <a href="{{ url_for('admin.gestionar_editoriales') }}">Editoriales</a>
  <a href="{{ url_for('admin.gestionar_generos') }}">Géneros</a>
</nav>
<section class="panel">
<form method="post" class="form">
<label>Nombre*<input name="name" required></label>
<button class="btn" type="submit">Guardar</button>
</form>
</section>
{% if autores %}
<ul class="list-plain">{% for a in autores %}<li>{{ a['name'] }}</li>{% endfor %}</ul>
{% else %}<p class="empty">Sin autores.</p>{% endif %}
{% endblock %}
