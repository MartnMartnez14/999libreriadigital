{% extends "base.html" %}
{% block title %}Registro · Bluffer{% endblock %}
{% block content %}
<div class="auth-wrap">
<section class="auth-card">
<h1>Crear cuenta</h1>
<form method="post" class="form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Usuario<input name="username" required autocomplete="username"></label>
<label>Contraseña (mín. 6)<input name="password" type="password" required autocomplete="new-password"></label>
<button class="btn btn-block" type="submit">Registrarme</button>
</form>
<p class="auth-foot">¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}">Entrá</a></p>
</section>
</div>
{% endblock %}
